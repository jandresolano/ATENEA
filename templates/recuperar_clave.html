<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Conjunto Residencial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='recuperar_clave.css') }}">
</head>
<body>
    <div class="login-container">
        <h2>Recuperar Contraseña</h2>
        
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% if mensajes %}
                {% for categoria, mensaje in mensajes %}
                    <div class="mensaje {{ categoria }}">{{ mensaje }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <button type="submit">Enviar código de recuperación</button>
        </form>
        
        <div style="margin-top: 20px; font-size: 14px; text-align: center;">
            <p><a href="{{ url_for('login') }}" style="color: #0056b3;">Volver al inicio de sesión</a></p>
        </div>
    </div>
</body>
</html>
